AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudFormation template para desplegar la aplicacion backend de Miamente
  con ALB y RDS PostgreSQL. Usa la VPC por defecto y el LabRole existente.

Parameters:
  EnvironmentName:
    Type: String
    Description: "Nombre del entorno (ej: staging, production). Usado para nombrar recursos."
    AllowedValues: [staging, production]
  DockerImageUri:
    Type: String
    Description: "URI completo de la imagen Docker a desplegar (ej: usuario/repo:tag)."
  LabRoleArn:
    Type: String
    Description: ARN completo del rol IAM 'LabRole' existente en la cuenta.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: ID de la VPC por defecto donde desplegar.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Lista de al menos DOS IDs de subredes PUBLICAS de la VPC por defecto en diferentes AZs.
  DBSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Lista de al menos DOS IDs de subredes PRIVADAS para la base de datos.
  DBUsername:
    Type: String
    Description: Nombre de usuario maestro para la base de datos PostgreSQL
    Default: postgres
    MinLength: 1
    MaxLength: 63
  DBPassword:
    Type: String
    Description: Contraseña para el usuario maestro de la base de datos PostgreSQL
    NoEcho: true
    MinLength: 8
    MaxLength: 128

Resources:
  # --- Grupo de Logs para ECS ---
  ECSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/miamente-backend-${EnvironmentName}-task'
      RetentionInDays: 7 # Retener logs por 7 días (ajusta si es necesario)
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # --- Cluster ECS ---
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub 'miamente-backend-${EnvironmentName}-cluster'
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # --- Seguridad ---
  # Security Group para el Load Balancer (permite HTTP desde internet)
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub 'alb-sg-${EnvironmentName}'
      GroupDescription: Permite trafico HTTP al ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # Security Group para RDS PostgreSQL
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub 'rds-sg-${EnvironmentName}'
      GroupDescription: Permite trafico PostgreSQL desde ECS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ECSServiceSecurityGroup
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # Security Group para el Servicio ECS (permite trafico desde el ALB en el puerto 8000)
  ECSServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub 'ecs-service-sg-${EnvironmentName}'
      GroupDescription: Permite trafico desde el ALB al servicio ECS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000 # Puerto del contenedor
          ToPort: 8000
          SourceSecurityGroupId: !Ref ALBSecurityGroup # Solo permite desde el ALB SG
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          DestinationSecurityGroupId: !Ref RDSSecurityGroup
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0 # Para llamadas HTTPS salientes
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0 # Para llamadas HTTP salientes
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # --- RDS PostgreSQL ---
  # Subnet Group para RDS
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub 'miamente-db-subnet-group-${EnvironmentName}'
      DBSubnetGroupDescription: Subnet group para RDS PostgreSQL
      SubnetIds: !Ref DBSubnetIds
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # Instancia RDS PostgreSQL
  PostgreSQLDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub 'miamente-postgres-${EnvironmentName}'
      DBName: miamente
      Engine: postgres
      EngineVersion: '15.4' # Versión estable de PostgreSQL
      DBInstanceClass: db.t3.micro # Instancia pequeña para desarrollo/staging
      AllocatedStorage: 20
      StorageType: gp2
      StorageEncrypted: true
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      BackupRetentionPeriod: 7
      MultiAZ: false # Para staging, usar true para production
      PubliclyAccessible: false
      DeletionProtection: false # Para staging, usar true para production
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
    DeletionPolicy: Snapshot # Crear snapshot antes de eliminar

  # --- Load Balancer ---
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub 'miamente-backend-${EnvironmentName}-alb'
      Subnets: !Ref SubnetIds # Debe estar en subredes publicas
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Scheme: internet-facing
      Type: application
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # Listener HTTP en el puerto 80
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ECSTargetGroup

  # Target Group para las tareas ECS
  ECSTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub 'tg-ecs-${EnvironmentName}'
      VpcId: !Ref VpcId
      Port: 8000 # Puerto del contenedor
      Protocol: HTTP
      TargetType: ip # Necesario para Fargate
      # --- Propiedades de Health Check (CORREGIDO) ---
      HealthCheckEnabled: true
      HealthCheckPath: /health # Endpoint de health check de la app
      HealthCheckPort: '8000' # Puerto del contenedor
      HealthCheckProtocol: HTTP
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      HealthCheckIntervalSeconds: 15 # Nombre corregido
      HealthCheckTimeoutSeconds: 5  # Nombre corregido
      # --- Fin Propiedades de Health Check ---
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # --- Definicion de Tarea ECS ---
  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn: 
      - ECSLogGroup # Asegura que el Log Group exista primero
      - PostgreSQLDatabase # Asegura que la BD exista antes de crear la tarea
    Properties:
      Family: !Sub 'miamente-backend-${EnvironmentName}-task'
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '256' # 0.25 vCPU (minimo Fargate)
      Memory: '512' # 0.5 GB (minimo Fargate)
      TaskRoleArn: !Ref LabRoleArn # Rol para permisos DENTRO del contenedor (si necesita llamar a otros servicios AWS)
      ExecutionRoleArn: !Ref LabRoleArn # Rol para que ECS/Fargate pueda descargar imagen, enviar logs, etc.
      ContainerDefinitions:
        - Name: !Sub 'miamente-backend-${EnvironmentName}-container'
          Image: !Ref DockerImageUri # Imagen de Docker Hub
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: DB_HOST
              Value: !GetAtt PostgreSQLDatabase.Endpoint.Address
            - Name: DB_PORT
              Value: !GetAtt PostgreSQLDatabase.Endpoint.Port
            - Name: DB_NAME
              Value: miamente
            - Name: DB_USER
              Value: !Ref DBUsername
            - Name: DB_PASSWORD
              Value: !Ref DBPassword
            - Name: ENVIRONMENT
              Value: !Ref EnvironmentName
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ECSLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # --- Servicio ECS ---
  ECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub 'miamente-backend-${EnvironmentName}-service'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref ECSTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds 
          SecurityGroups:
            - !Ref ECSServiceSecurityGroup
      LoadBalancers:
        - ContainerName: !Sub 'miamente-backend-${EnvironmentName}-container'
          ContainerPort: 8000
          TargetGroupArn: !Ref ECSTargetGroup
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
    DependsOn:
      - ALBListener

Outputs:
  ALBDnsName:
    Description: DNS Name of the Application Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub '${AWS::StackName}-ALBDnsName'
  ECSClusterName:
    Description: Name of the ECS Cluster
    Value: !Ref ECSCluster
    Export:
      Name: !Sub '${AWS::StackName}-ECSClusterName'
  ECSServiceName:
    Description: Name of the ECS Service
    Value: !GetAtt ECSService.Name
    Export:
      Name: !Sub '${AWS::StackName}-ECSServiceName'
  DatabaseEndpoint:
    Description: RDS PostgreSQL Database Endpoint
    Value: !GetAtt PostgreSQLDatabase.Endpoint.Address
    Export:
      Name: !Sub '${AWS::StackName}-DatabaseEndpoint'
  DatabasePort:
    Description: RDS PostgreSQL Database Port
    Value: !GetAtt PostgreSQLDatabase.Endpoint.Port
    Export:
      Name: !Sub '${AWS::StackName}-DatabasePort'