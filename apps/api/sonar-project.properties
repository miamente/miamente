sonar.projectKey=miamente_backend
sonar.organization=miamente

# Sources
sonar.sources=app

# Test sources
sonar.tests=tests

# Python configuration (Backend)
sonar.python.version=3.13
sonar.python.pylint.reportPaths=artifacts-downloaded/pylint-report.txt
sonar.python.flake8.reportPaths=artifacts-downloaded/flake8-report.txt
sonar.python.coverage.reportPaths=artifacts-downloaded/unit_coverage.xml,artifacts-downloaded/integration_coverage.xml

# Coverage exclusions
sonar.coverage.exclusions=**/__init__.py,**/__pycache__/**

# Global exclusions (exclude from source analysis)
sonar.exclusions=**/__pycache__/**,**/dist/**,**/build/**,**/coverage/**

# Quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
