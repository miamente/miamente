sonar.projectKey=miamente_frontend
sonar.organization=miamente

# Sources
sonar.sources=src

# Test sources
sonar.tests=src

# Test file patterns for frontend tests
# Include all __tests__ directories and test files with common patterns
sonar.test.inclusions=src/**/__tests__/**/*,src/**/*.test.*,src/**/*.spec.*,src/**/test-utils.*,vitest.config.*,vitest.setup.*

# JavaScript/TypeScript configuration (Frontend)
sonar.javascript.lcov.reportPaths=artifacts-downloaded/apps/web/coverage/lcov.info
sonar.typescript.lcov.reportPaths=artifacts-downloaded/apps/web/coverage/lcov.info
sonar.eslint.reportPaths=artifacts-downloaded/apps/web/eslint-report.json

# Coverage exclusions
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/node_modules/**,**/.next/**,**/*.d.ts

# Global exclusions (exclude from source analysis)
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,src/**/__tests__/**,src/**/*.test.*,src/**/*.spec.*,src/**/test-utils.*,vitest.config.*,vitest.setup.*

# Quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
