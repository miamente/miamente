AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CloudFormation template for deploying Miamente frontend (Next.js React app)
  with ALB and ECS Fargate. Uses existing VPC and LabRole.

Parameters:
  EnvironmentName:
    Type: String
    Description: "Environment name (e.g., staging, production). Used for resource naming."
    AllowedValues: [staging, production]
  DockerImageUri:
    Type: String
    Description: "Complete URI of the Docker image to deploy (e.g., user/repo:tag)."
  LabRoleArn:
    Type: String
    Description: "Complete ARN of the existing 'LabRole' IAM role in the account."
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "ID of the default VPC where to deploy."
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: "List of at least TWO IDs of PUBLIC subnets of the default VPC in different AZs."
  BackendApiUrl:
    Type: String
    Description: "Backend API URL (ALB URL from backend deployment)"
    Default: ""
  PROJECT_NAME:
    Type: String
    Description: "Project name"
    Default: "Miamente"
  VERSION:
    Type: String
    Description: "Application version"
    Default: "1.0.0"

Conditions:
  IsProduction: !Equals [!Ref EnvironmentName, "production"]

Resources:
  # ECS Cluster
  FrontendCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "miamente-frontend-${EnvironmentName}-cluster"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  # Task Definition
  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "miamente-frontend-${EnvironmentName}-task"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !If [IsProduction, "1024", "512"]
      Memory: !If [IsProduction, "2048", "1024"]
      ExecutionRoleArn: !Ref LabRoleArn
      TaskRoleArn: !Ref LabRoleArn
      ContainerDefinitions:
        - Name: frontend
          Image: !Ref DockerImageUri
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: !If [IsProduction, "production", "development"]
            - Name: NEXT_PUBLIC_API_URL
              Value: !Ref BackendApiUrl
            - Name: PROJECT_NAME
              Value: !Ref PROJECT_NAME
            - Name: VERSION
              Value: !Ref VERSION
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FrontendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend
          HealthCheck:
            Command:
              - CMD-SHELL
              - "curl -f http://localhost:3000/health || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

  # CloudWatch Log Group
  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/miamente-frontend-${EnvironmentName}"
      RetentionInDays: !If [IsProduction, 30, 7]

  # Security Group for ALB
  FrontendALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "miamente-frontend-${EnvironmentName}-alb-sg"
      GroupDescription: "Security group for frontend ALB"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "miamente-frontend-${EnvironmentName}-alb-sg"

  # Security Group for ECS Service
  FrontendECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "miamente-frontend-${EnvironmentName}-ecs-sg"
      GroupDescription: "Security group for frontend ECS service"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref FrontendALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "miamente-frontend-${EnvironmentName}-ecs-sg"

  # Application Load Balancer
  FrontendALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "miamente-frontend-${EnvironmentName}-alb"
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref FrontendALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "miamente-frontend-${EnvironmentName}-alb"

  # Target Group
  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "miamente-frontend-${EnvironmentName}-tg"
      Port: 3000
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Tags:
        - Key: Name
          Value: !Sub "miamente-frontend-${EnvironmentName}-tg"

  # ALB Listener
  FrontendALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup
      LoadBalancerArn: !Ref FrontendALB
      Port: 80
      Protocol: HTTP

  # ECS Service
  FrontendService:
    Type: AWS::ECS::Service
    DependsOn: FrontendALBListener
    Properties:
      ServiceName: !Sub "miamente-frontend-${EnvironmentName}-service"
      Cluster: !Ref FrontendCluster
      TaskDefinition: !Ref FrontendTaskDefinition
      DesiredCount: !If [IsProduction, 2, 1]
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          SecurityGroups:
            - !Ref FrontendECSSecurityGroup
          Subnets: !Ref SubnetIds
          AssignPublicIp: ENABLED
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: 3000
          TargetGroupArn: !Ref FrontendTargetGroup

  # Auto Scaling Target
  FrontendAutoScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !If [IsProduction, 10, 3]
      MinCapacity: !If [IsProduction, 2, 1]
      ResourceId: !Sub "service/${FrontendCluster}/${FrontendService}"
      RoleARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService"
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  # Auto Scaling Policy (CPU)
  FrontendAutoScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "miamente-frontend-${EnvironmentName}-cpu-scaling"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref FrontendAutoScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70.0
        ScaleInCooldown: 300
        ScaleOutCooldown: 300

Outputs:
  FrontendALBUrl:
    Description: "URL of the frontend Application Load Balancer"
    Value: !Sub "http://${FrontendALB.DNSName}"
    Export:
      Name: !Sub "${AWS::StackName}-FrontendALBUrl"

  FrontendClusterName:
    Description: "Name of the ECS cluster"
    Value: !Ref FrontendCluster
    Export:
      Name: !Sub "${AWS::StackName}-FrontendClusterName"

  FrontendServiceName:
    Description: "Name of the ECS service"
    Value: !Ref FrontendService
    Export:
      Name: !Sub "${AWS::StackName}-FrontendServiceName"

  FrontendTaskDefinitionArn:
    Description: "ARN of the task definition"
    Value: !Ref FrontendTaskDefinition
    Export:
      Name: !Sub "${AWS::StackName}-FrontendTaskDefinitionArn"

  FrontendLogGroupName:
    Description: "Name of the CloudWatch log group"
    Value: !Ref FrontendLogGroup
    Export:
      Name: !Sub "${AWS::StackName}-FrontendLogGroupName"
