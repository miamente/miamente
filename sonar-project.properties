sonar.projectKey=miamente_miamente
sonar.organization=miamente

# Sources
sonar.sources=backend/app,apps/web/src

# Test sources
sonar.tests=backend/tests,apps/web/src

# Test file patterns for frontend tests
# Include all __tests__ directories and test files with common patterns
sonar.test.inclusions=apps/web/src/**/__tests__/**/*,apps/web/src/**/*.test.*,apps/web/src/**/*.spec.*,apps/web/src/**/test-utils.*,apps/web/vitest.config.*,apps/web/vitest.setup.*

# Python configuration (Backend)
sonar.python.version=3.13
sonar.python.pylint.reportPaths=artifacts-downloaded/pylint-report.txt
sonar.python.flake8.reportPaths=artifacts-downloaded/flake8-report.txt
sonar.python.coverage.reportPaths=artifacts-downloaded/unit_coverage.xml,artifacts-downloaded/integration_coverage.xml

# JavaScript/TypeScript configuration (Frontend)
sonar.javascript.lcov.reportPaths=artifacts-downloaded/coverage/lcov.info
sonar.typescript.lcov.reportPaths=artifacts-downloaded/coverage/lcov.info
sonar.eslint.reportPaths=artifacts-downloaded/eslint-report.json

# Coverage exclusions
sonar.coverage.exclusions=**/__init__.py,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/node_modules/**,**/.next/**,**/*.d.ts,**/__pycache__/**

# Global exclusions (exclude from source analysis)
sonar.exclusions=**/node_modules/**,**/.next/**,**/__pycache__/**,**/dist/**,**/build/**,**/coverage/**,apps/web/src/**/__tests__/**,apps/web/src/**/*.test.*,apps/web/src/**/*.spec.*,apps/web/src/**/test-utils.*,apps/web/vitest.config.*,apps/web/vitest.setup.*

# Quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
