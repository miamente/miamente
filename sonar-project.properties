sonar.projectKey=miamente_miamente
sonar.organization=miamente

# Sources
sonar.sources=backend/app,apps/web/src

# Test sources
sonar.tests=backend/tests,apps/web/src/__tests__

# Python configuration (Backend)
sonar.python.version=3.13
sonar.python.pylint.reportPaths=backend/artifacts-downloaded/pylint-report.txt
sonar.python.flake8.reportPaths=backend/artifacts-downloaded/flake8-report.txt
sonar.python.coverage.reportPaths=backend/artifacts-downloaded/unit_coverage.xml,backend/artifacts-downloaded/integration_coverage.xml

# JavaScript/TypeScript configuration (Frontend)
sonar.javascript.lcov.reportPaths=apps/web/artifacts-downloaded/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/web/artifacts-downloaded/coverage/lcov.info
sonar.eslint.reportPaths=apps/web/artifacts-downloaded/eslint-report.json

# Coverage exclusions
sonar.coverage.exclusions=**/__init__.py,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/node_modules/**,**/.next/**,**/*.d.ts,**/__pycache__/**

# Global exclusions
sonar.exclusions=**/node_modules/**,**/.next/**,**/__pycache__/**,**/dist/**,**/build/**,**/coverage/**

# Quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
