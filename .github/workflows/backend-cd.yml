name: Backend CD

on:
  push:
    branches: [main, staging]
    paths:
      - "backend/**"
      - ".github/workflows/backend-cd.yml"
      - ".github/actions/setup-backend/**"

env:
  PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
  VERSION: ${{ secrets.VERSION }}
  API_V1_STR: ${{ secrets.API_V1_STR }}
  DEBUG: ${{ secrets.DEBUG }}
  ALGORITHM: ${{ secrets.ALGORITHM }}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
  REFRESH_TOKEN_EXPIRE_MINUTES: ${{ secrets.REFRESH_TOKEN_EXPIRE_MINUTES }}
  SERVER_NAME: ${{ secrets.SERVER_NAME }}
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
  BACKEND_CORS_ORIGINS: ${{ secrets.BACKEND_CORS_ORIGINS }}
  TIMEZONE: ${{ secrets.TIMEZONE }}
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

defaults:
  run:
    working-directory: backend

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python & deps
        uses: ./.github/actions/setup-backend
        with:
          python-version: "3.13"

      - name: Run Unit Tests with pytest and Coverage
        run: |
          pytest \
            --ignore=tests/integration \
            --cov=app \
            --cov-report=xml:unit_coverage.xml \
            --cov-report=html \
            --html=unit_report.html \
            --self-contained-html

      - name: Upload Test Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: |
            backend/unit_report.html
            backend/unit_coverage.xml

  docker-build-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_BACKEND_REPOSITORY }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_BACKEND_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-cfn-staging:
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    outputs:
      alb_url_staging: ${{ steps.get_stack_outputs.outputs.alb_url }}
      cluster_name_staging: "miamente-backend-staging-cluster"
      service_name_staging: "miamente-backend-staging-service"
      database_endpoint_staging: ${{ steps.get_stack_outputs.outputs.database_endpoint }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Build params JSON + Precheck (Staging)
        run: |
          set -euo pipefail

          # ---------- 1) Construcción de variables ----------
          IMAGE_URI="${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_BACKEND_REPOSITORY }}:${{ github.sha }}"
          LAB_ROLE_ARN="${{ secrets.LAB_ROLE_ARN }}"
          VPC_ID="${{ secrets.VPC_ID }}"
          SUBNET_IDS="${{ secrets.SUBNET_IDS }}"            # ej: subnet-aaa,subnet-bbb (sin espacios)
          DB_SUBNET_IDS="${{ secrets.DB_SUBNET_IDS }}"      # ej: subnet-xxx,subnet-yyy
          DB_USERNAME="${{ secrets.DB_USERNAME }}"
          DB_PASSWORD="${{ secrets.DB_PASSWORD }}"

          PROJECTNAME="${{ secrets.PROJECT_NAME }}"
          VERSION="${{ secrets.VERSION }}"
          APIV1STR="${{ secrets.API_V1_STR }}"
          DEBUG="${{ secrets.DEBUG }}"
          ALGORITHM="${{ secrets.ALGORITHM }}"
          ACCESSTOKENEXPIREMINUTES="${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}"
          REFRESHTOKENEXPIREMINUTES="${{ secrets.REFRESH_TOKEN_EXPIRE_MINUTES }}"
          SERVERNAME="${{ secrets.SERVER_NAME }}"
          SERVERHOST="${{ secrets.SERVER_HOST }}"
          ALLOWEDHOSTS="${{ secrets.ALLOWED_HOSTS }}"
          BACKENDCORSORIGINS="${{ secrets.BACKEND_CORS_ORIGINS }}"
          TIMEZONE="${{ secrets.TIME_ZONE }}"
          SECRETKEY="${{ secrets.SECRET_KEY }}"

          # ---------- 2) Pre-chequeo de vacíos ----------
          missing=()
          check_empty () { var_name="$1"; val="${!var_name:-}"; if [ -z "$val" ]; then missing+=("$var_name"); fi; }

          for k in IMAGE_URI LAB_ROLE_ARN VPC_ID SUBNET_IDS DB_SUBNET_IDS DB_USERNAME DB_PASSWORD \
                   PROJECTNAME VERSION APIV1STR DEBUG ALGORITHM ACCESSTOKENEXPIREMINUTES \
                   REFRESHTOKENEXPIREMINUTES SERVERNAME SERVERHOST ALLOWEDHOSTS BACKENDCORSORIGINS \
                   TIMEZONE SECRETKEY; do
            check_empty "$k"
          done

          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ Parámetros/secretos VACÍOS detectados:"
            for m in "${missing[@]}"; do echo " - $m"; done
            exit 1
          else
            echo "✅ Todos los parámetros tienen valor (no vacíos)."
          fi

          # ---------- 3) Generar params-staging.json con jq ----------
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

          jq -n \
            --arg envName "staging" \
            --arg imageUri "$IMAGE_URI" \
            --arg labRoleArn "$LAB_ROLE_ARN" \
            --arg vpcId "$VPC_ID" \
            --arg subnetIds "$SUBNET_IDS" \
            --arg dbSubnetIds "$DB_SUBNET_IDS" \
            --arg dbUser "$DB_USERNAME" \
            --arg dbPass "$DB_PASSWORD" \
            --arg projectname "$PROJECTNAME" \
            --arg version "$VERSION" \
            --arg apiv1str "$APIV1STR" \
            --arg debug "$DEBUG" \
            --arg algorithm "$ALGORITHM" \
            --arg accessmins "$ACCESSTOKENEXPIREMINUTES" \
            --arg refreshmins "$REFRESHTOKENEXPIREMINUTES" \
            --arg servername "$SERVERNAME" \
            --arg serverhost "$SERVERHOST" \
            --arg allowedhosts "$ALLOWEDHOSTS" \
            --arg backendcors "$BACKENDCORSORIGINS" \
            --arg timezone "$TIMEZONE" \
            --arg secretkey "$SECRETKEY" \
            '[
              {"ParameterKey":"EnvironmentName","ParameterValue":$envName},
              {"ParameterKey":"DockerImageUri","ParameterValue":$imageUri},
              {"ParameterKey":"LabRoleArn","ParameterValue":$labRoleArn},
              {"ParameterKey":"VpcId","ParameterValue":$vpcId},
              {"ParameterKey":"SubnetIds","ParameterValue":$subnetIds},
              {"ParameterKey":"DBSubnetIds","ParameterValue":$dbSubnetIds},
              {"ParameterKey":"DBUsername","ParameterValue":$dbUser},
              {"ParameterKey":"DBPassword","ParameterValue":$dbPass},
              {"ParameterKey":"PROJECTNAME","ParameterValue":$projectname},
              {"ParameterKey":"VERSION","ParameterValue":$version},
              {"ParameterKey":"APIV1STR","ParameterValue":$apiv1str},
              {"ParameterKey":"DEBUG","ParameterValue":$debug},
              {"ParameterKey":"ALGORITHM","ParameterValue":$algorithm},
              {"ParameterKey":"ACCESSTOKENEXPIREMINUTES","ParameterValue":$accessmins},
              {"ParameterKey":"REFRESHTOKENEXPIREMINUTES","ParameterValue":$refreshmins},
              {"ParameterKey":"SERVERNAME","ParameterValue":$servername},
              {"ParameterKey":"SERVERHOST","ParameterValue":$serverhost},
              {"ParameterKey":"ALLOWEDHOSTS","ParameterValue":$allowedhosts},
              {"ParameterKey":"BACKENDCORSORIGINS","ParameterValue":$backendcors},
              {"ParameterKey":"TIMEZONE","ParameterValue":$timezone},
              {"ParameterKey":"SECRETKEY","ParameterValue":$secretkey}
            ]' > params-staging.json

          # ---------- 4) Imprimir versión enmascarada para depurar ----------
          echo "🔎 params-staging.json (enmascarado):"
          jq '[ .[] | {ParameterKey, ParameterValue:"***"} ]' params-staging.json

          
      - name: Deploy CloudFormation Staging Stack (with params json)
        run: |
          set -euo pipefail

          echo "🚀 Desplegando con params-staging.json…"

          # Carga cada línea Key=Value en un array
          mapfile -t PARAMS < <(jq -r '.[] | "\(.ParameterKey)=\(.ParameterValue)"' params-staging.json)

          echo "🔎 Parámetros a enviar (keys únicamente):"
          for p in "${PARAMS[@]}"; do
            echo " - ${p%%=*}"
          done

          # Llama al deploy con el array, cada Key=Value queda atómico
          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name miamente-staging-stack \
            --parameter-overrides "${PARAMS[@]}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changes


      - name: Get Staging Stack Outputs
        id: get_stack_outputs
        run: |
          if ! command -v jq &> /dev/null; then
             sudo apt-get update && sudo apt-get install -y jq
          fi

          STACK_OUTPUTS=$(aws cloudformation describe-stacks --stack-name miamente-staging-stack --query "Stacks[0].Outputs" --region us-east-1 --output json)
          echo "Raw Stack Outputs: $STACK_OUTPUTS"

          ALB_URL=$(echo $STACK_OUTPUTS | jq -r '.[] | select(.OutputKey=="ALBDnsName") | .OutputValue')
          DATABASE_ENDPOINT=$(echo $STACK_OUTPUTS | jq -r '.[] | select(.OutputKey=="DatabaseEndpoint") | .OutputValue')

          if [ -z "$ALB_URL" ] || [ "$ALB_URL" == "null" ]; then
            echo "Error: No se pudo obtener ALBDnsName del stack de Staging."
            exit 1
          fi

          if [ -z "$DATABASE_ENDPOINT" ] || [ "$DATABASE_ENDPOINT" == "null" ]; then
            echo "Error: No se pudo obtener DatabaseEndpoint del stack de Staging."
            exit 1
          fi

          ALB_URL_HTTP="http://${ALB_URL}"
          echo "ALB URL Staging: $ALB_URL_HTTP"
          echo "Database Endpoint Staging: $DATABASE_ENDPOINT"
          echo "alb_url=${ALB_URL_HTTP}" >> $GITHUB_OUTPUT
          echo "database_endpoint=${DATABASE_ENDPOINT}" >> $GITHUB_OUTPUT

  update-service-staging:
    needs: [docker-build-push, deploy-cfn-staging]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    defaults:
      run:
        working-directory: .
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Force New Deployment ECS Service Staging
        run: |
          echo "Forcing new deployment for Staging service..."
          aws ecs update-service --cluster ${{ needs.deploy-cfn-staging.outputs.cluster_name_staging }} \
                                --service ${{ needs.deploy-cfn-staging.outputs.service_name_staging }} \
                                --force-new-deployment \
                                --region us-east-1

          echo "Waiting for Staging service deployment to stabilize..."
          aws ecs wait services-stable --cluster ${{ needs.deploy-cfn-staging.outputs.cluster_name_staging }} --services ${{ needs.deploy-cfn-staging.outputs.service_name_staging }} --region us-east-1
          echo "Staging service deployment stable."

  test-db-staging:
    needs: [update-service-staging, deploy-cfn-staging]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    defaults:
      run:
        working-directory: .
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Test Database Connection Staging
        run: |
          echo "Testing database connection for staging environment..."
          echo "Database endpoint: ${{ needs.deploy-cfn-staging.outputs.database_endpoint_staging }}"
          
          sleep 60
          
          HEALTH_CHECK_URL="${{ needs.deploy-cfn-staging.outputs.alb_url_staging }}/health"
          echo "Checking health endpoint: $HEALTH_CHECK_URL"
          
          for i in {1..5}; do
            if curl -f -s "$HEALTH_CHECK_URL"; then
              echo "Health check passed on attempt $i"
              break
            else
              echo "Health check failed on attempt $i, retrying..."
              sleep 30
            fi
            
            if [ $i -eq 5 ]; then
              echo "Health check failed after 5 attempts"
              exit 1
            fi
          done

  test-staging:
    needs: [test-db-staging, deploy-cfn-staging]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    env:
      APP_BASE_URL: ${{ needs.deploy-cfn-staging.outputs.alb_url_staging }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python & deps
        uses: ./.github/actions/setup-backend
        with:
          python-version: "3.13"

      - name: Run Integration Tests
        run: |
          pytest tests/integration \
            --cov=app \
            --cov-report=xml:integration_coverage.xml \
            --html=integration_report.html \
            --self-contained-html

      - name: Upload Test Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-reports
          path: |
            backend/integration_report.html
            backend/integration_coverage.xml
    
  sonar:
    name: SonarCloud (aggregate coverage)
    runs-on: ubuntu-latest
    needs: [unit-tests, test-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4

      - name: Download unit artifacts
        uses: actions/download-artifact@v4
        with:
          name: unit-test-reports
          path: artifacts-downloaded

      - name: Download integration artifacts
        uses: actions/download-artifact@v4
        with:
          name: integration-test-reports
          path: artifacts-downloaded

      - name: SonarCloud Scan (Backend)
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          projectBaseDir: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  notify-success:
    needs: [test-db-staging]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deployment Success Notification
        run: |
          echo "Deployment completed successfully!"
          echo "Staging URL: ${{ needs.deploy-cfn-staging.outputs.alb_url_staging }}"
          echo "Staging DB: ${{ needs.deploy-cfn-staging.outputs.database_endpoint_staging }}"