name: Backend CD

on:
  push:
    branches: [staging, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-cd.yml"
      - ".github/actions/setup-backend/**"
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [staging, main]

jobs:
  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    outputs:
      backend_url: ${{ steps.get-url.outputs.backend_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        id: deploy
        run: |
          # Set environment and token based on branch
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="production"
            export RAILWAY_TOKEN="${{ secrets.RAILWAY_TOKEN_PROD }}"
            echo "Deploying backend to production environment"
          else
            ENV="staging"
            export RAILWAY_TOKEN="${{ secrets.RAILWAY_TOKEN_STG }}"
            echo "Deploying backend to staging environment"
          fi
          
          # Deploy using Railway CLI
          railway up --service miamente-backend --environment $ENV

      - name: Get Deployment URL
        id: get-url
        run: |
          # Set environment and token based on branch
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="production"
            export RAILWAY_TOKEN="${{ secrets.RAILWAY_TOKEN_PROD }}"
          else
            ENV="staging"
            export RAILWAY_TOKEN="${{ secrets.RAILWAY_TOKEN_STG }}"
          fi
          
          # Get the deployment URL from Railway
          BACKEND_URL=$(railway domain --service miamente-backend --environment $ENV 2>/dev/null | grep -o 'https://[^[:space:]]*' | head -1)
          
          # Fallback to predefined URLs if command fails
          if [ -z "$BACKEND_URL" ]; then
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              BACKEND_URL="https://miamente-backend.railway.app"
            else
              BACKEND_URL="https://miamente-backend-staging.railway.app"
            fi
          fi
          
          echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "🌐 Backend URL: $BACKEND_URL"

      - name: Wait for deployment
        run: sleep 120

      - name: Health check
        run: |
          BACKEND_URL="${{ steps.get-url.outputs.backend_url }}"
          
          echo "Checking backend health at: $BACKEND_URL"
          curl -f "$BACKEND_URL/health" || exit 1
          echo "✅ Backend deployment successful!"
          echo "🌐 Backend URL: $BACKEND_URL"
          echo "📊 API Docs: $BACKEND_URL/docs"
