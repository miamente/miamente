name: Backend CD

on:
  push:
    branches: [main, staging]
    paths:
      - "backend/**"
      - ".github/workflows/backend-cd.yml"

env:
  PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
  VERSION: ${{ secrets.VERSION }}
  API_V1_STR: ${{ secrets.API_V1_STR }}
  DEBUG: ${{ secrets.DEBUG }}
  ALGORITHM: ${{ secrets.ALGORITHM }}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
  REFRESH_TOKEN_EXPIRE_MINUTES: ${{ secrets.REFRESH_TOKEN_EXPIRE_MINUTES }}
  SERVER_NAME: ${{ secrets.SERVER_NAME }}
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
  BACKEND_CORS_ORIGINS: ${{ secrets.BACKEND_CORS_ORIGINS }}
  TIMEZONE: ${{ secrets.TIMEZONE }}
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

defaults:
  run:
    working-directory: backend

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python & deps
        uses: ./.github/actions/setup-backend
        with:
          python-version: "3.13"

      - name: Run Unit Tests with pytest and Coverage
        run: |
          pytest \
            --ignore=tests/integration \
            --cov=app \
            --cov-report=xml:unit_coverage.xml \
            --cov-report=html \
            --html=unit_report.html \
            --self-contained-html

      - name: Upload Test Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: |
            backend/unit_report.html
            backend/unit_coverage.xml

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U ${{ secrets.POSTGRES_USER }} -d ${{ secrets.POSTGRES_DB }}"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgresql+psycopg2://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python & deps
        uses: ./.github/actions/setup-backend
        with:
          python-version: "3.13"

      - name: Run DB migrations
        run: alembic upgrade head

      - name: Run Integration Tests
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 8
          pytest tests/integration \
            --cov=app \
            --cov-report=xml:integration_coverage.xml \
            --html=integration_report.html \
            --self-contained-html

      - name: Upload Test Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-reports
          path: |
            backend/integration_report.html
            backend/integration_coverage.xml

  sonar:
    name: SonarCloud (aggregate coverage)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Download unit artifacts
        uses: actions/download-artifact@v4
        with:
          name: unit-test-reports
          path: artifacts-downloaded

      - name: Download integration artifacts
        uses: actions/download-artifact@v4
        with:
          name: integration-test-reports
          path: artifacts-downloaded

      - name: SonarCloud Scan (Backend)
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          projectBaseDir: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build-push:
    name: Build & Push Docker image (main only)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, sonar]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_BACKEND_REPOSITORY }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_BACKEND_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
