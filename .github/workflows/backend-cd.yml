name: Backend CD

on:
  push:
    branches: [staging, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-cd.yml"
      - ".github/actions/setup-backend/**"

permissions:
  contents: write
  actions: write

env:
  PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
  VERSION: ${{ secrets.VERSION }}
  API_V1_STR: ${{ secrets.API_V1_STR }}
  DEBUG: ${{ secrets.DEBUG }}
  ALGORITHM: ${{ secrets.ALGORITHM }}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
  REFRESH_TOKEN_EXPIRE_MINUTES: ${{ secrets.REFRESH_TOKEN_EXPIRE_MINUTES }}
  SERVER_NAME: ${{ secrets.SERVER_NAME }}
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
  BACKEND_CORS_ORIGINS: ${{ secrets.BACKEND_CORS_ORIGINS }}
  TIMEZONE: ${{ secrets.TIME_ZONE }}
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

defaults:
  run:
    working-directory: backend

jobs:
  docker-build-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_BACKEND_REPOSITORY }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_BACKEND_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Note: AWS CloudFormation deployment removed
  # This workflow now only handles Docker image building and pushing
  # Actual deployment is handled by Railway deployment workflows
