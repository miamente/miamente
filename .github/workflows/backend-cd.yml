name: Backend CD

on:
  push:
    branches: [staging, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-cd.yml"
      - ".github/actions/setup-backend/**"
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [staging, main]

jobs:
  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Deploying backend to production environment"
            railway login --token ${{ secrets.RAILWAY_TOKEN }}
            railway environment set production
            railway up --service miamente-backend --detach
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "Deploying backend to staging environment"
            railway login --token ${{ secrets.RAILWAY_TOKEN }}
            railway environment set staging
            railway up --service miamente-backend --detach
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for deployment
        run: sleep 120

      - name: Health check
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            BACKEND_URL="https://miamente-backend.railway.app"
          else
            BACKEND_URL="https://miamente-backend-staging.railway.app"
          fi
          
          echo "Checking backend health..."
          curl -f "$BACKEND_URL/health" || exit 1
          echo "✅ Backend deployment successful!"
          echo "🌐 Backend URL: $BACKEND_URL"
          echo "📊 API Docs: $BACKEND_URL/docs"
