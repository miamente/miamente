name: Frontend CD

on:
  pull_request:
    branches: [fix]
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-cd.yml"
      - ".github/actions/setup-frontend/**"

defaults:
  run:
    working-directory: apps/web

jobs:
  unit-tests:
    name: Unit & Accessibility Tests
    runs-on: ubuntu-latest
    needs:
      - lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js & deps
        uses: ./.github/actions/setup-frontend
        with:
          node-version: "22"

      - name: Run Unit & Accessibility Tests with Vitest and Coverage
        run: |
          npm run test:ci
          echo "Test execution completed. Checking for generated files..."
          echo "Looking for coverage directory:"
          ls -la coverage/ || echo "❌ coverage/ directory not found"
          echo "Looking for test-results directory:"
          ls -la test-results/ || echo "❌ test-results/ directory not found"
          echo "All files in current directory:"
          ls -la

      - name: Upload Test Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-unit-test-reports
          path: |
            apps/web/coverage/
            apps/web/test-results/

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js & deps
        uses: ./.github/actions/setup-frontend
        with:
          node-version: "22"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Compute API URL and base URL
        id: meta
        run: |
          BRANCH="${GITHUB_BASE_REF:-${GITHUB_REF##*/}}"
          if [ "$BRANCH" = "main" ]; then
            echo "NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL_PROD }}" >> $GITHUB_ENV
          else
            echo "NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL_STAGING }}" >> $GITHUB_ENV
          fi
          echo "E2E_BASE_URL=http://localhost:3000" >> $GITHUB_ENV

      - name: Build & start Next (background)
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          NODE_ENV: production
        run: |
          npm run build
          nohup npm run start -- -p 3000 > .next.out 2>&1 &
          for i in {1..60}; do
            if curl -sSf "$E2E_BASE_URL" >/dev/null; then echo "Frontend is up"; break; fi
            sleep 2
          done

      - name: Run Playwright E2E
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          E2E_BASE_URL: ${{ env.E2E_BASE_URL }}
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/

  docker-build-push:
    name: Build & Push Docker image (main only)
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, sonar]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_FRONTEND_REPOSITORY }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_FRONTEND_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sonar:
    name: SonarCloud Frontend Analysis
    runs-on: ubuntu-latest
    needs:
      - docker-build-validate
    steps:
      - uses: actions/checkout@v4

      - name: Download unit test artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-unit-test-reports
          path: apps/web/artifacts-downloaded

      - name: Download E2E test artifacts
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: apps/web/artifacts-downloaded

      - name: SonarCloud Scan (Frontend)
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          projectBaseDir: apps/web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

