name: Frontend CD

on:
  push:
    branches: [staging, main]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-cd.yml"
      - ".github/actions/setup-frontend/**"
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [staging, main]

jobs:
  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        id: deploy
        run: |
          # Set environment and token based on branch
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="production"
            export RAILWAY_TOKEN="${{ secrets.RAILWAY_TOKEN_PROD }}"
            echo "Deploying frontend to production environment"
          else
            ENV="staging"
            export RAILWAY_TOKEN="${{ secrets.RAILWAY_TOKEN_STG }}"
            echo "Deploying frontend to staging environment"
          fi
          
          # Deploy using Railway CLI
          railway up --service miamente-frontend --environment $ENV

      - name: Get Deployment URL
        id: get-url
        run: |
          # Set environment and token based on branch
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="production"
            export RAILWAY_TOKEN="${{ secrets.RAILWAY_TOKEN_PROD }}"
          else
            ENV="staging"
            export RAILWAY_TOKEN="${{ secrets.RAILWAY_TOKEN_STG }}"
          fi
          
          # Get the deployment URL from Railway
          FRONTEND_URL=$(railway domain --service miamente-frontend --environment $ENV 2>/dev/null | grep -o 'https://[^[:space:]]*' | head -1)
          
          # Fallback to predefined URLs if command fails
          if [ -z "$FRONTEND_URL" ]; then
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              FRONTEND_URL="https://miamente.com"
            else
              FRONTEND_URL="https://miamente-staging.railway.app"
            fi
          fi
          
          echo "frontend_url=$FRONTEND_URL" >> $GITHUB_OUTPUT
          echo "🌐 Frontend URL: $FRONTEND_URL"

      - name: Wait for deployment
        run: sleep 120

      - name: Health check
        run: |
          FRONTEND_URL="${{ steps.get-url.outputs.frontend_url }}"
          
          echo "Checking frontend health at: $FRONTEND_URL"
          curl -f "$FRONTEND_URL/api/health" || exit 1
          echo "✅ Frontend deployment successful!"
          echo "🌐 Frontend URL: $FRONTEND_URL"
