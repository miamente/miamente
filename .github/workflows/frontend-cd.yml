name: Frontend CD

on:
  push:
    branches: [staging, main]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-cd.yml"
      - ".github/actions/setup-frontend/**"
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend URL for testing'
        required: true
        type: string
      environment:
        description: 'Environment (staging or production)'
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  actions: read

env:
  PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
  VERSION: ${{ secrets.VERSION }}
  TIMEZONE: ${{ secrets.TIME_ZONE }}

defaults:
  run:
    working-directory: apps/web

jobs:
  docker-build-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_FRONTEND_REPOSITORY }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_FRONTEND_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Note: AWS CloudFormation deployment removed
  # This workflow now only handles Docker image building and pushing
  # Actual deployment is handled by Railway deployment workflows
