name: Frontend CD

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-cd.yml"
      - ".github/actions/setup-frontend/**"

defaults:
  run:
    working-directory: apps/web

jobs:
  unit-tests:
    name: Unit & Accessibility Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js & deps
        uses: ./.github/actions/setup-frontend
        with:
          node-version: "22"

      - name: Run Unit & Accessibility Tests with Vitest and Coverage
        run: |
          npm run test:ci
          echo "Test execution completed. Checking for generated files..."
          echo "Looking for coverage directory:"
          ls -la coverage/ || echo "❌ coverage/ directory not found"
          echo "Looking for test-results directory:"
          ls -la test-results/ || echo "❌ test-results/ directory not found"
          echo "All files in current directory:"
          ls -la

      - name: Upload Test Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-unit-test-reports
          path: |
            apps/web/coverage/
            apps/web/test-results/

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [unit-tests]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      BACKEND_INTERNAL_URL: http://localhost:8000
      NODE_ENV: production
      E2E_BASE_URL: http://localhost:3000
      PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
      VERSION: ${{ secrets.VERSION }}
      API_V1_STR: ${{ secrets.API_V1_STR }}
      DEBUG: ${{ secrets.DEBUG }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
      REFRESH_TOKEN_EXPIRE_MINUTES: ${{ secrets.REFRESH_TOKEN_EXPIRE_MINUTES }}
      SERVER_NAME: ${{ secrets.SERVER_NAME }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      BACKEND_CORS_ORIGINS: ${{ secrets.BACKEND_CORS_ORIGINS }}
      TIMEZONE: ${{ secrets.TIMEZONE }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python & backend deps
        uses: ./.github/actions/setup-backend
        with:
          python-version: "3.13"

      - name: Run DB migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Start backend (background) & wait for health
        working-directory: backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.out 2>&1 &
          echo "Waiting for backend at $NEXT_PUBLIC_API_URL/health ..."
          for i in {1..60}; do
            if curl -fsS "$NEXT_PUBLIC_API_URL/health" >/dev/null; then
              echo "Backend is up ✅"
              break
            fi
            echo "Attempt $i/60: Backend not ready yet..."
            sleep 2
          done
          # Final check
          if ! curl -fsS "$NEXT_PUBLIC_API_URL/health" >/dev/null; then
            echo "❌ Backend failed to start after 2 minutes"
            echo "Backend logs:"
            cat backend.out || echo "No backend logs found"
            exit 1
          fi

      - name: Setup Node.js & deps
        uses: ./.github/actions/setup-frontend
        with:
          node-version: "22"

      - name: Ensure devDependencies (Tailwind/PostCSS)
        run: npm ci --include=dev
        env:
          NODE_ENV: development

      - name: Install Playwright browsers & system deps
        working-directory: .
        run: npx playwright install --with-deps

      - name: Build & start Next (background)
        run: |
          npm run build
          nohup npm run start -- -p 3000 > .next.out 2>&1 &
          echo "Waiting for frontend at $E2E_BASE_URL ..."
          for i in {1..60}; do
            if curl -fsS "$E2E_BASE_URL" >/dev/null; then
              echo "Frontend is up ✅"
              break
            fi
            echo "Attempt $i/60: Frontend not ready yet..."
            sleep 2
          done
          # Final check
          if ! curl -fsS "$E2E_BASE_URL" >/dev/null; then
            echo "❌ Frontend failed to start after 2 minutes"
            echo "Frontend logs:"
            cat .next.out || echo "No frontend logs found"
            exit 1
          fi

      - name: Run Playwright E2E
        working-directory: .
        env:
          BACKEND_INTERNAL_URL: ${{ env.BACKEND_INTERNAL_URL }}
        run: |
          echo "🔍 Running Playwright tests..."
          echo "Backend URL: $BACKEND_INTERNAL_URL"
          echo "Frontend URL: $E2E_BASE_URL"
          echo "Current directory: $(pwd)"

          # Verify services are running
          echo "Checking backend health..."
          curl -fsS "$BACKEND_INTERNAL_URL/health" || echo "❌ Backend health check failed"

          echo "Checking frontend..."
          curl -fsS "$E2E_BASE_URL" || echo "❌ Frontend check failed"

          # Run Playwright tests directly from the root directory
          echo "Running Playwright tests..."
          npx playwright test --reporter=line,html,json || echo "⚠️ Playwright tests completed with some issues"

          echo "Test execution completed. Exit code: $?"

          # List files after test execution
          echo "Files after test execution:"
          ls -la
          echo "Playwright report directory:"
          ls -la playwright-report/ || echo "❌ playwright-report/ not found"
          echo "Test results directory:"
          ls -la test-results/ || echo "❌ test-results/ not found"

      - name: Upload Playwright report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  docker-build-push:
    name: Build & Push Docker image (main only)
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_FRONTEND_REPOSITORY }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_FRONTEND_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sonar:
    name: SonarCloud Frontend Analysis
    runs-on: ubuntu-latest
    needs:
      - docker-build-push
    steps:
      - name: Download unit test artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-unit-test-reports
          path: apps/web/artifacts-downloaded

      - name: Download E2E test artifacts
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: apps/web/e2e-artifacts-downloaded

      - name: SonarCloud Scan (Frontend)
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          projectBaseDir: apps/web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy-cfn-staging:
    needs: [docker-build-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    outputs:
      alb_url_staging: ${{ steps.get_stack_outputs.outputs.FrontendALBUrl }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy CloudFormation Staging Stack
        run: |
          IMAGE_URI="${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_FRONTEND_REPOSITORY }}:${{ github.sha }}"
          echo "Deploying Image URI: $IMAGE_URI"

          aws cloudformation deploy \
            --template-file apps/web/template.yaml \
            --stack-name miamente-frontend-staging \
            --parameter-overrides \
              EnvironmentName=staging \
              DockerImageUri=$IMAGE_URI \
              LabRoleArn=${{ secrets.LAB_ROLE_ARN }} \
              VpcId=${{ secrets.VPC_ID }} \
              SubnetIds=${{ secrets.SUBNET_IDS }} \
              BackendApiUrl=${{ secrets.BACKEND_API_URL_STAGING }} \
              BackendInternalUrl=${{ secrets.BACKEND_INTERNAL_URL_STAGING || secrets.BACKEND_API_URL_STAGING }} \
              PROJECTNAME=${{ secrets.PROJECT_NAME }} \
              VERSION=${{ secrets.VERSION }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Get Stack Outputs
        id: get_stack_outputs
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name miamente-frontend-staging \
            --query 'Stacks[0].Outputs')

          echo "FrontendALBUrl=$(echo $OUTPUTS | jq -r '.[] | select(.OutputKey=="FrontendALBUrl") | .OutputValue')" >> $GITHUB_OUTPUT

  deploy-cfn-prod:
    needs: [docker-build-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      alb_url_prod: ${{ steps.get_stack_outputs.outputs.FrontendALBUrl }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy CloudFormation Production Stack
        run: |
          IMAGE_URI="${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_FRONTEND_REPOSITORY }}:${{ github.sha }}"
          echo "Deploying Image URI: $IMAGE_URI"

          aws cloudformation deploy \
            --template-file apps/web/template.yaml \
            --stack-name miamente-frontend-production \
            --parameter-overrides \
              EnvironmentName=production \
              DockerImageUri=$IMAGE_URI \
              LabRoleArn=${{ secrets.LAB_ROLE_ARN }} \
              VpcId=${{ secrets.VPC_ID }} \
              SubnetIds=${{ secrets.SUBNET_IDS }} \
              BackendApiUrl=${{ secrets.BACKEND_API_URL_PROD }} \
              BackendInternalUrl=${{ secrets.BACKEND_INTERNAL_URL_PROD || secrets.BACKEND_API_URL_PROD }} \
              PROJECTNAME=${{ secrets.PROJECT_NAME }} \
              VERSION=${{ secrets.VERSION }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Get Stack Outputs
        id: get_stack_outputs
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name miamente-frontend-production \
            --query 'Stacks[0].Outputs')

          echo "FrontendALBUrl=$(echo $OUTPUTS | jq -r '.[] | select(.OutputKey=="FrontendALBUrl") | .OutputValue')" >> $GITHUB_OUTPUT
