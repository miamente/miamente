name: Frontend CD

on:
  push:
    branches: [staging, main]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-cd.yml"
      - ".github/actions/setup-frontend/**"
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend ALB URL from backend deployment'
        required: true
        type: string
      environment:
        description: 'Environment (staging or production)'
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  actions: read

env:
  PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
  VERSION: ${{ secrets.VERSION }}
  TIMEZONE: ${{ secrets.TIME_ZONE }}

defaults:
  run:
    working-directory: apps/web

jobs:
  unit-tests:
    name: Unit & Accessibility Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js & deps
        uses: ./.github/actions/setup-frontend
        with:
          node-version: "22"

      - name: Run Unit & Accessibility Tests with Vitest and Coverage
        run: |
          npm run test:ci
          echo "Test execution completed. Checking for generated files..."
          echo "Looking for coverage directory:"
          ls -la coverage/ || echo "❌ coverage/ directory not found"
          echo "Looking for test-results directory:"
          ls -la test-results/ || echo "❌ test-results/ directory not found"
          echo "All files in current directory:"
          ls -la

      - name: Upload Test Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-unit-test-reports
          path: |
            apps/web/coverage/
            apps/web/test-results/

  e2e-tests-staging:
    name: E2E Tests (Playwright) - Staging Environment
    runs-on: ubuntu-latest
    needs: [deploy-cfn-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    env:
      # Use deployed staging URLs instead of localhost
      FRONTEND_STAGING_URL: ${{ needs.deploy-cfn-staging.outputs.alb_url_staging }}
      NODE_ENV: production
      PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
      VERSION: ${{ secrets.VERSION }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js & deps
        uses: ./.github/actions/setup-frontend
        with:
          node-version: "22"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Get Backend URL for E2E Tests
        id: get_backend_url_e2e
        if: github.event_name == 'push'
        run: |
          echo "Getting backend ALB URL for E2E tests..."
          BACKEND_ALB_URL=$(aws cloudformation describe-stacks \
            --stack-name miamente-staging-stack \
            --query 'Stacks[0].Outputs[?OutputKey==`ALBDnsName`].OutputValue' \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$BACKEND_ALB_URL" ] || [ "$BACKEND_ALB_URL" == "None" ]; then
            echo "❌ Backend stack not found or ALB URL not available"
            echo "Please ensure backend is deployed first"
            exit 1
          fi
          
          BACKEND_ALB_URL_HTTP="http://${BACKEND_ALB_URL}"
          echo "✅ Backend ALB URL: $BACKEND_ALB_URL_HTTP"
          echo "backend_alb_url=$BACKEND_ALB_URL_HTTP" >> $GITHUB_OUTPUT

      - name: Setup Node.js for E2E tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install E2E test dependencies
        working-directory: tests/e2e
        run: |
          echo "Installing E2E test dependencies..."
          echo "Current directory: $(pwd)"
          echo "Package.json contents:"
          cat package.json
          
          # Clean install with npm ci (faster and more reliable for CI)
          echo "Running npm ci..."
          npm ci --verbose
          echo "Dependencies installed successfully"

      - name: Install Playwright browsers & system deps
        working-directory: tests/e2e
        run: |
          echo "Installing Playwright browsers and system dependencies..."
          echo "Current directory: $(pwd)"
          
          # Install browsers and system dependencies (npm ci should have already installed @playwright/test)
          echo "Installing Playwright browsers..."
          npx playwright install --with-deps
          echo "Playwright installation completed"

      - name: Wait for Staging Environment to be Ready
        run: |
          echo "🔍 Waiting for staging environment to be ready..."
          echo "Backend URL: ${{ steps.get_backend_url_e2e.outputs.backend_alb_url }}"
          echo "Frontend URL: ${{ env.FRONTEND_STAGING_URL }}"
          
          # Wait for backend to be ready
          echo "Checking backend health..."
          for i in {1..30}; do
            if curl -f -s --max-time 10 "${{ steps.get_backend_url_e2e.outputs.backend_alb_url }}/health"; then
              echo "✅ Backend staging is ready!"
              break
            else
              echo "⏳ Backend not ready yet, waiting 10 seconds... (attempt $i/30)"
              sleep 10
            fi
            
            if [ $i -eq 30 ]; then
              echo "❌ Backend staging failed to become ready after 5 minutes"
              exit 1
            fi
          done
          
          # Wait for frontend to be ready
          echo "Checking frontend staging..."
          for i in {1..30}; do
            if curl -f -s --max-time 10 "${{ env.FRONTEND_STAGING_URL }}"; then
              echo "✅ Frontend staging is ready!"
              break
            else
              echo "⏳ Frontend not ready yet, waiting 10 seconds... (attempt $i/30)"
              sleep 10
            fi
            
            if [ $i -eq 30 ]; then
              echo "❌ Frontend staging failed to become ready after 5 minutes"
              exit 1
            fi
          done

      - name: Run Playwright E2E Tests Against Staging
        working-directory: tests/e2e
        env:
          # Override test URLs to use staging environment
          E2E_BASE_URL: ${{ env.FRONTEND_STAGING_URL }}
          BACKEND_INTERNAL_URL: ${{ steps.get_backend_url_e2e.outputs.backend_alb_url }}
          # Backend API URL for data seeding and API tests
          BACKEND_API_URL: ${{ steps.get_backend_url_e2e.outputs.backend_alb_url }}
          # Test data configuration
          E2E_TEST_PASSWORD: "TestPassword123!"
        run: |
          echo "🔍 Running Playwright tests against staging environment..."
          echo "Backend URL: $BACKEND_INTERNAL_URL"
          echo "Frontend URL: $E2E_BASE_URL"
          echo "Current directory: $(pwd)"
          
          # Debug information
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Package.json exists: $([ -f package.json ] && echo 'Yes' || echo 'No')"
          echo "node_modules exists: $([ -d node_modules ] && echo 'Yes' || echo 'No')"
          echo "Playwright binary exists: $([ -f node_modules/.bin/playwright ] && echo 'Yes' || echo 'No')"
          echo "Package contents:"
          ls -la node_modules/@playwright/ || echo "❌ @playwright directory not found"
          
          # Check if Playwright is properly installed
          if [ ! -f node_modules/.bin/playwright ]; then
            echo "❌ Playwright binary not found, attempting to reinstall..."
            npm install @playwright/test
            npx playwright install --with-deps
          fi

          # Verify staging environment is accessible
          echo "Final verification of staging environment..."
          curl -fsS "$BACKEND_INTERNAL_URL/health" || echo "❌ Backend health check failed"
          curl -fsS "$E2E_BASE_URL" || echo "❌ Frontend check failed"
          
          # Ensure backend has test data (check if specialties endpoint returns data)
          echo "Checking if backend has test data..."
          if curl -fsS "$BACKEND_INTERNAL_URL/api/v1/specialties" | jq -e '. | length > 0' > /dev/null 2>&1; then
            echo "✅ Backend has test data"
          else
            echo "⚠️ Backend appears to have no test data - tests will seed data automatically"
          fi

          # Run Playwright tests against staging using npm script (more reliable)
          echo "Running Playwright tests against staging..."
          
          # Set environment variables for the test run
          export PLAYWRIGHT_BASE_URL="$E2E_BASE_URL"
          export BACKEND_API_URL="$BACKEND_INTERNAL_URL"
          export E2E_TEST_PASSWORD="TestPassword123!"
          
          # Run tests with timeout and error handling
          timeout 600 npm run test -- --reporter=line,html,json --timeout=30000 || {
            exit_code=$?
            if [ $exit_code -eq 124 ]; then
              echo "⚠️ Tests timed out after 10 minutes"
            elif [ $exit_code -eq 0 ]; then
              echo "✅ All tests passed"
            else
              echo "⚠️ Some tests failed or had issues (exit code: $exit_code)"
            fi
          }

          echo "Test execution completed. Exit code: $?"

          # List files after test execution
          echo "Files after test execution:"
          ls -la
          echo "Playwright report directory:"
          ls -la playwright-report/ || echo "❌ playwright-report/ not found"
          echo "Test results directory:"
          ls -la test-results/ || echo "❌ test-results/ not found"

      - name: Upload Playwright report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-staging-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/

  docker-build-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_FRONTEND_REPOSITORY }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_FRONTEND_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sonar:
    name: SonarCloud Frontend Analysis
    runs-on: ubuntu-latest
    # Ensure Sonar runs only after E2E (Playwright) completes in staging dispatch
    needs:
      - unit-tests
      - e2e-tests-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4

      - name: Download unit test artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-unit-test-reports
          path: apps/web/artifacts-downloaded

      - name: Download E2E test artifacts
        uses: actions/download-artifact@v4
        with:
          name: playwright-staging-report
          path: apps/web/e2e-artifacts-downloaded

      - name: SonarCloud Scan (Frontend)
        uses: SonarSource/sonarqube-scan-action@v5.3.1
        with:
          projectBaseDir: apps/web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy-cfn-staging:
    needs: [docker-build-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    outputs:
      alb_url_staging: ${{ steps.get_stack_outputs.outputs.FrontendALBUrl }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Get Backend URL
        id: get_backend_url
        run: |
          # Get from CloudFormation stack
          echo "Getting backend ALB URL from backend stack..."
          BACKEND_ALB_URL=$(aws cloudformation describe-stacks \
            --stack-name miamente-staging-stack \
            --query 'Stacks[0].Outputs[?OutputKey==`ALBDnsName`].OutputValue' \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$BACKEND_ALB_URL" ] || [ "$BACKEND_ALB_URL" == "None" ]; then
            echo "❌ Backend stack not found or ALB URL not available"
            echo "Please ensure backend is deployed first"
            exit 1
          fi
          
          BACKEND_ALB_URL_HTTP="http://${BACKEND_ALB_URL}"
          echo "✅ Backend ALB URL: $BACKEND_ALB_URL_HTTP"
          echo "backend_alb_url=$BACKEND_ALB_URL_HTTP" >> $GITHUB_OUTPUT

      - name: Build params JSON + Precheck (Staging)
        run: |
          set -euo pipefail

          IMAGE_URI="${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_FRONTEND_REPOSITORY }}:${{ github.sha }}"
          LAB_ROLE_ARN="${{ secrets.LAB_ROLE_ARN }}"
          VPC_ID="${{ secrets.VPC_ID }}"
          SUBNET_IDS="${{ secrets.SUBNET_IDS }}"
          PROJECTNAME="${{ env.PROJECT_NAME }}"
          VERSION="${{ env.VERSION }}"
          TIMEZONE="${{ env.TIMEZONE }}"
          BACKEND_URL="${{ steps.get_backend_url.outputs.backend_alb_url }}"
          BACKEND_INTERNAL_URL="${{ steps.get_backend_url.outputs.backend_alb_url }}"

          missing=()
          check_empty () { var_name="$1"; val="${!var_name:-}"; if [ -z "$val" ]; then missing+=("$var_name"); fi; }
          for k in IMAGE_URI LAB_ROLE_ARN VPC_ID SUBNET_IDS PROJECTNAME VERSION TIMEZONE BACKEND_URL BACKEND_INTERNAL_URL; do
            check_empty "$k"
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ Parámetros/secretos VACÍOS detectados (frontend staging):"
            for m in "${missing[@]}"; do echo " - $m"; done
            exit 1
          else
            echo "✅ Todos los parámetros tienen valor (no vacíos)."
          fi

          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

          jq -n \
            --arg envName "staging" \
            --arg imageUri "$IMAGE_URI" \
            --arg labRoleArn "$LAB_ROLE_ARN" \
            --arg vpcId "$VPC_ID" \
            --arg subnetIds "$SUBNET_IDS" \
            --arg backendUrl "$BACKEND_URL" \
            --arg backendInternalUrl "$BACKEND_INTERNAL_URL" \
            --arg projectname "$PROJECTNAME" \
            --arg version "$VERSION" \
            --arg timezone "$TIMEZONE" \
            '[
              {"ParameterKey":"EnvironmentName","ParameterValue":$envName},
              {"ParameterKey":"DockerImageUri","ParameterValue":$imageUri},
              {"ParameterKey":"LabRoleArn","ParameterValue":$labRoleArn},
              {"ParameterKey":"VpcId","ParameterValue":$vpcId},
              {"ParameterKey":"SubnetIds","ParameterValue":$subnetIds},
              {"ParameterKey":"BackendApiUrl","ParameterValue":$backendUrl},
              {"ParameterKey":"BackendInternalUrl","ParameterValue":$backendInternalUrl},
              {"ParameterKey":"PROJECTNAME","ParameterValue":$projectname},
              {"ParameterKey":"VERSION","ParameterValue":$version},
              {"ParameterKey":"TIMEZONE","ParameterValue":$timezone}
            ]' > params-staging.json

          echo "🔎 params-staging.json (enmascarado):"
          jq '[ .[] | {ParameterKey, ParameterValue:"***"} ]' params-staging.json

      - name: Deploy CloudFormation Staging Stack (with params json)
        run: |
          set -euo pipefail
          echo "🚀 Desplegando con params-staging.json…"
          mapfile -t PARAMS < <(jq -r '.[] | "\(.ParameterKey)=\(.ParameterValue)"' params-staging.json)

          echo "🔎 Parámetros a enviar (keys únicamente):"
          for p in "${PARAMS[@]}"; do
            echo " - ${p%%=*}"
          done

          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name miamente-frontend-staging \
            --parameter-overrides "${PARAMS[@]}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Get Stack Outputs
        id: get_stack_outputs
        run: |
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name miamente-frontend-staging \
            --query 'Stacks[0].Outputs')

          echo "FrontendALBUrl=$(echo $OUTPUTS | jq -r '.[] | select(.OutputKey=="FrontendALBUrl") | .OutputValue')" >> $GITHUB_OUTPUT

  deploy-cfn-prod:
    needs: [docker-build-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      alb_url_prod: ${{ steps.get_stack_outputs.outputs.FrontendALBUrl }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Get Backend URL
        id: get_backend_url_prod
        run: |
          # Get from CloudFormation stack
          echo "Getting backend ALB URL from backend production stack..."
          BACKEND_ALB_URL=$(aws cloudformation describe-stacks \
            --stack-name miamente-production-stack \
            --query 'Stacks[0].Outputs[?OutputKey==`ALBDnsName`].OutputValue' \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$BACKEND_ALB_URL" ] || [ "$BACKEND_ALB_URL" == "None" ]; then
            echo "❌ Backend production stack not found or ALB URL not available"
            echo "Please ensure backend is deployed first"
            exit 1
          fi
          
          BACKEND_ALB_URL_HTTP="http://${BACKEND_ALB_URL}"
          echo "✅ Backend ALB URL: $BACKEND_ALB_URL_HTTP"
          echo "backend_alb_url=$BACKEND_ALB_URL_HTTP" >> $GITHUB_OUTPUT

      - name: Build params JSON + Precheck (Production)
        run: |
          set -euo pipefail

          IMAGE_URI="${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_FRONTEND_REPOSITORY }}:${{ github.sha }}"
          LAB_ROLE_ARN="${{ secrets.LAB_ROLE_ARN }}"
          VPC_ID="${{ secrets.VPC_ID }}"
          SUBNET_IDS="${{ secrets.SUBNET_IDS }}"
          PROJECTNAME="${{ env.PROJECT_NAME }}"
          VERSION="${{ env.VERSION }}"
          TIMEZONE="${{ env.TIMEZONE }}"
          BACKEND_URL="${{ steps.get_backend_url_prod.outputs.backend_alb_url }}"
          BACKEND_INTERNAL_URL="${{ steps.get_backend_url_prod.outputs.backend_alb_url }}"

          missing=()
          check_empty () { var_name="$1"; val="${!var_name:-}"; if [ -z "$val" ]; then missing+=("$var_name"); fi; }
          for k in IMAGE_URI LAB_ROLE_ARN VPC_ID SUBNET_IDS PROJECTNAME VERSION TIMEZONE BACKEND_URL BACKEND_INTERNAL_URL; do
            check_empty "$k"
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ Parámetros/secretos VACÍOS detectados (frontend production):"
            for m in "${missing[@]}"; do echo " - $m"; done
            exit 1
          else
            echo "✅ Todos los parámetros tienen valor (no vacíos)."
          fi

          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

          jq -n \
            --arg envName "production" \
            --arg imageUri "$IMAGE_URI" \
            --arg labRoleArn "$LAB_ROLE_ARN" \
            --arg vpcId "$VPC_ID" \
            --arg subnetIds "$SUBNET_IDS" \
            --arg backendUrl "$BACKEND_URL" \
            --arg backendInternalUrl "$BACKEND_INTERNAL_URL" \
            --arg projectname "$PROJECTNAME" \
            --arg version "$VERSION" \
            --arg timezone "$TIMEZONE" \
            '[
              {"ParameterKey":"EnvironmentName","ParameterValue":$envName},
              {"ParameterKey":"DockerImageUri","ParameterValue":$imageUri},
              {"ParameterKey":"LabRoleArn","ParameterValue":$labRoleArn},
              {"ParameterKey":"VpcId","ParameterValue":$vpcId},
              {"ParameterKey":"SubnetIds","ParameterValue":$subnetIds},
              {"ParameterKey":"BackendApiUrl","ParameterValue":$backendUrl},
              {"ParameterKey":"BackendInternalUrl","ParameterValue":$backendInternalUrl},
              {"ParameterKey":"PROJECTNAME","ParameterValue":$projectname},
              {"ParameterKey":"VERSION","ParameterValue":$version},
              {"ParameterKey":"TIMEZONE","ParameterValue":$timezone}
            ]' > params-production.json

          echo "🔎 params-production.json (enmascarado):"
          jq '[ .[] | {ParameterKey, ParameterValue:"***"} ]' params-production.json

      - name: Deploy CloudFormation Production Stack (with params json)
        run: |
          set -euo pipefail
          mapfile -t PARAMS < <(jq -r '.[] | "\(.ParameterKey)=\(.ParameterValue)"' params-production.json)
          echo "🚀 Desplegando stack production…"
          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name miamente-frontend-production \
            --parameter-overrides "${PARAMS[@]}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Get Stack Outputs
        id: get_stack_outputs
        run: |
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name miamente-frontend-production \
            --query 'Stacks[0].Outputs')

          echo "FrontendALBUrl=$(echo $OUTPUTS | jq -r '.[] | select(.OutputKey=="FrontendALBUrl") | .OutputValue')" >> $GITHUB_OUTPUT
