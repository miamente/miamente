name: Frontend CD

on:
  repository_dispatch:
    types: [frontend-deploy-staging, frontend-deploy-production]
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend ALB URL from backend deployment'
        required: true
        type: string
      environment:
        description: 'Environment (staging or production)'
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  actions: read

defaults:
  run:
    working-directory: apps/web

jobs:
  unit-tests:
    name: Unit & Accessibility Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js & deps
        uses: ./.github/actions/setup-frontend
        with:
          node-version: "22"

      - name: Run Unit & Accessibility Tests with Vitest and Coverage
        run: |
          npm run test:ci
          echo "Test execution completed. Checking for generated files..."
          echo "Looking for coverage directory:"
          ls -la coverage/ || echo "❌ coverage/ directory not found"
          echo "Looking for test-results directory:"
          ls -la test-results/ || echo "❌ test-results/ directory not found"
          echo "All files in current directory:"
          ls -la

      - name: Upload Test Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-unit-test-reports
          path: |
            apps/web/coverage/
            apps/web/test-results/

  e2e-tests-staging:
    name: E2E Tests (Playwright) - Staging Environment
    runs-on: ubuntu-latest
    needs: [deploy-cfn-staging]
    if: github.event_name == 'repository_dispatch' && github.event.action == 'frontend-deploy-staging'

    env:
      # Use deployed staging URLs instead of localhost
      BACKEND_STAGING_URL: ${{ github.event.client_payload.backend_url }}
      FRONTEND_STAGING_URL: ${{ needs.deploy-cfn-staging.outputs.alb_url_staging }}
      NODE_ENV: production
      PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
      VERSION: ${{ secrets.VERSION }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js & deps
        uses: ./.github/actions/setup-frontend
        with:
          node-version: "22"

      - name: Install E2E test dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright browsers & system deps
        working-directory: tests/e2e
        run: npx playwright install --with-deps

      - name: Wait for Staging Environment to be Ready
        run: |
          echo "🔍 Waiting for staging environment to be ready..."
          echo "Backend URL: ${{ env.BACKEND_STAGING_URL }}"
          echo "Frontend URL: ${{ env.FRONTEND_STAGING_URL }}"
          
          # Wait for backend to be ready
          echo "Checking backend health..."
          for i in {1..30}; do
            if curl -f -s --max-time 10 "${{ env.BACKEND_STAGING_URL }}/health"; then
              echo "✅ Backend staging is ready!"
              break
            else
              echo "⏳ Backend not ready yet, waiting 10 seconds... (attempt $i/30)"
              sleep 10
            fi
            
            if [ $i -eq 30 ]; then
              echo "❌ Backend staging failed to become ready after 5 minutes"
              exit 1
            fi
          done
          
          # Wait for frontend to be ready
          echo "Checking frontend staging..."
          for i in {1..30}; do
            if curl -f -s --max-time 10 "${{ env.FRONTEND_STAGING_URL }}"; then
              echo "✅ Frontend staging is ready!"
              break
            else
              echo "⏳ Frontend not ready yet, waiting 10 seconds... (attempt $i/30)"
              sleep 10
            fi
            
            if [ $i -eq 30 ]; then
              echo "❌ Frontend staging failed to become ready after 5 minutes"
              exit 1
            fi
          done

      - name: Run Playwright E2E Tests Against Staging
        working-directory: tests/e2e
        env:
          # Override test URLs to use staging environment
          E2E_BASE_URL: ${{ env.FRONTEND_STAGING_URL }}
          BACKEND_INTERNAL_URL: ${{ env.BACKEND_STAGING_URL }}
        run: |
          echo "🔍 Running Playwright tests against staging environment..."
          echo "Backend URL: $BACKEND_INTERNAL_URL"
          echo "Frontend URL: $E2E_BASE_URL"
          echo "Current directory: $(pwd)"

          # Verify staging environment is accessible
          echo "Final verification of staging environment..."
          curl -fsS "$BACKEND_INTERNAL_URL/health" || echo "❌ Backend health check failed"
          curl -fsS "$E2E_BASE_URL" || echo "❌ Frontend check failed"

          # Run Playwright tests against staging
          echo "Running Playwright tests against staging..."
          npx playwright test --reporter=line,html,json || echo "⚠️ Playwright tests completed with some issues"

          echo "Test execution completed. Exit code: $?"

          # List files after test execution
          echo "Files after test execution:"
          ls -la
          echo "Playwright report directory:"
          ls -la playwright-report/ || echo "❌ playwright-report/ not found"
          echo "Test results directory:"
          ls -la test-results/ || echo "❌ test-results/ not found"

      - name: Upload Playwright report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-staging-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/

  docker-build-push:
    name: Build & Push Docker image (main only)
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_FRONTEND_REPOSITORY }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_FRONTEND_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sonar:
    name: SonarCloud Frontend Analysis
    runs-on: ubuntu-latest
    needs:
      - docker-build-push
    steps:
      - uses: actions/checkout@v4

      - name: Download unit test artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-unit-test-reports
          path: apps/web/artifacts-downloaded

      - name: Download E2E test artifacts
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: apps/web/e2e-artifacts-downloaded

      - name: SonarCloud Scan (Frontend)
        uses: SonarSource/sonarqube-scan-action@v5.3.1
        with:
          projectBaseDir: apps/web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy-cfn-staging:
    needs: [docker-build-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' && github.event.action == 'frontend-deploy-staging'
    outputs:
      alb_url_staging: ${{ steps.get_stack_outputs.outputs.FrontendALBUrl }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Get Backend URL from Repository Dispatch Payload
        id: get_backend_url
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            # Use backend URL from repository dispatch payload
            BACKEND_URL="${{ github.event.client_payload.backend_url }}"
            echo "✅ Using backend URL from repository dispatch: $BACKEND_URL"
            echo "backend_alb_url=$BACKEND_URL" >> $GITHUB_OUTPUT
          else
            # Fallback: Get from CloudFormation stack (for direct push triggers)
            echo "Getting backend ALB URL from backend stack..."
            BACKEND_ALB_URL=$(aws cloudformation describe-stacks \
              --stack-name miamente-staging-stack \
              --query 'Stacks[0].Outputs[?OutputKey==`ALBDnsName`].OutputValue' \
              --output text 2>/dev/null || echo "")
            
            if [ -z "$BACKEND_ALB_URL" ] || [ "$BACKEND_ALB_URL" == "None" ]; then
              echo "❌ Backend stack not found or ALB URL not available"
              echo "Please ensure backend is deployed first"
              exit 1
            fi
            
            BACKEND_ALB_URL_HTTP="http://${BACKEND_ALB_URL}"
            echo "✅ Backend ALB URL: $BACKEND_ALB_URL_HTTP"
            echo "backend_alb_url=$BACKEND_ALB_URL_HTTP" >> $GITHUB_OUTPUT
          fi

      - name: Deploy CloudFormation Staging Stack
        run: |
          IMAGE_URI="${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_FRONTEND_REPOSITORY }}:${{ github.sha }}"
          echo "Deploying Image URI: $IMAGE_URI"

          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name miamente-frontend-staging \
            --parameter-overrides \
              EnvironmentName=staging \
              DockerImageUri=$IMAGE_URI \
              LabRoleArn=${{ secrets.LAB_ROLE_ARN }} \
              VpcId=${{ secrets.VPC_ID }} \
              SubnetIds=${{ secrets.SUBNET_IDS }} \
              BackendApiUrl=${{ steps.get_backend_url.outputs.backend_alb_url }} \
              BackendInternalUrl=${{ steps.get_backend_url.outputs.backend_alb_url }} \
              PROJECTNAME=${{ secrets.PROJECT_NAME }} \
              VERSION=${{ secrets.VERSION }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Get Stack Outputs
        id: get_stack_outputs
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name miamente-frontend-staging \
            --query 'Stacks[0].Outputs')

          echo "FrontendALBUrl=$(echo $OUTPUTS | jq -r '.[] | select(.OutputKey=="FrontendALBUrl") | .OutputValue')" >> $GITHUB_OUTPUT

  deploy-cfn-prod:
    needs: [docker-build-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' && github.event.action == 'frontend-deploy-production'
    outputs:
      alb_url_prod: ${{ steps.get_stack_outputs.outputs.FrontendALBUrl }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Get Backend URL from Repository Dispatch Payload
        id: get_backend_url_prod
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            # Use backend URL from repository dispatch payload
            BACKEND_URL="${{ github.event.client_payload.backend_url }}"
            echo "✅ Using backend URL from repository dispatch: $BACKEND_URL"
            echo "backend_alb_url=$BACKEND_URL" >> $GITHUB_OUTPUT
          else
            # Fallback: Get from CloudFormation stack (for direct push triggers)
            echo "Getting backend ALB URL from backend production stack..."
            BACKEND_ALB_URL=$(aws cloudformation describe-stacks \
              --stack-name miamente-production-stack \
              --query 'Stacks[0].Outputs[?OutputKey==`ALBDnsName`].OutputValue' \
              --output text 2>/dev/null || echo "")
            
            if [ -z "$BACKEND_ALB_URL" ] || [ "$BACKEND_ALB_URL" == "None" ]; then
              echo "❌ Backend production stack not found or ALB URL not available"
              echo "Please ensure backend is deployed first"
              exit 1
            fi
            
            BACKEND_ALB_URL_HTTP="http://${BACKEND_ALB_URL}"
            echo "✅ Backend ALB URL: $BACKEND_ALB_URL_HTTP"
            echo "backend_alb_url=$BACKEND_ALB_URL_HTTP" >> $GITHUB_OUTPUT
          fi

      - name: Deploy CloudFormation Production Stack
        run: |
          IMAGE_URI="${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_FRONTEND_REPOSITORY }}:${{ github.sha }}"
          echo "Deploying Image URI: $IMAGE_URI"

          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name miamente-frontend-production \
            --parameter-overrides \
              EnvironmentName=production \
              DockerImageUri=$IMAGE_URI \
              LabRoleArn=${{ secrets.LAB_ROLE_ARN }} \
              VpcId=${{ secrets.VPC_ID }} \
              SubnetIds=${{ secrets.SUBNET_IDS }} \
              BackendApiUrl=${{ steps.get_backend_url_prod.outputs.backend_alb_url }} \
              BackendInternalUrl=${{ steps.get_backend_url_prod.outputs.backend_alb_url }} \
              PROJECTNAME=${{ secrets.PROJECT_NAME }} \
              VERSION=${{ secrets.VERSION }} \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Get Stack Outputs
        id: get_stack_outputs
        run: |
          OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name miamente-frontend-production \
            --query 'Stacks[0].Outputs')

          echo "FrontendALBUrl=$(echo $OUTPUTS | jq -r '.[] | select(.OutputKey=="FrontendALBUrl") | .OutputValue')" >> $GITHUB_OUTPUT
