# .github/workflows/frontend-cd.yml
name: Frontend CD

on:
  push:
    branches: [staging, main]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-cd.yml"
      - ".github/actions/setup-frontend/**"
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [staging, main]

jobs:
  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest

    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Railway Token by branch
        id: token
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "token=${{ secrets.RAILWAY_TOKEN_PROD }}" >> $GITHUB_OUTPUT
            echo "env=production" >> $GITHUB_OUTPUT
            echo "url=https://miamente.com" >> $GITHUB_OUTPUT
          else
            echo "token=${{ secrets.RAILWAY_TOKEN_STG }}" >> $GITHUB_OUTPUT
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "url=https://miamente-staging.railway.app" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          echo "Deploying frontend to ${{ steps.token.outputs.env }} environment"
          railway up --service frontend --environment ${{ steps.token.outputs.env }}

      - name: Health check
        run: |
          FRONTEND_URL="${{ steps.token.outputs.url }}"
          echo "Checking frontend health..."
          for i in {1..12}; do
            if curl -sf "$FRONTEND_URL/api/health" > /dev/null; then
              echo "✅ Frontend deployment healthy!"
              echo "🌐 $FRONTEND_URL"
              exit 0
            fi
            echo "Waiting for app to be ready... attempt $i"
            sleep 10
          done
          echo "❌ Health check failed"
          exit 1
