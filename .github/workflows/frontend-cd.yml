name: Frontend CD

on:
  push:
    branches: [staging, main]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-cd.yml"
      - ".github/actions/setup-frontend/**"
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [staging, main]

jobs:
  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Deploying frontend to production environment"
            railway login --token ${{ secrets.RAILWAY_TOKEN }}
            railway environment set production
            railway up --service miamente-frontend --detach
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "Deploying frontend to staging environment"
            railway login --token ${{ secrets.RAILWAY_TOKEN }}
            railway environment set staging
            railway up --service miamente-frontend --detach
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Wait for deployment
        run: sleep 120

      - name: Health check
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            FRONTEND_URL="https://miamente.com"
          else
            FRONTEND_URL="https://miamente-staging.railway.app"
          fi
          
          echo "Checking frontend health..."
          curl -f "$FRONTEND_URL/api/health" || exit 1
          echo "✅ Frontend deployment successful!"
          echo "🌐 Frontend URL: $FRONTEND_URL"
