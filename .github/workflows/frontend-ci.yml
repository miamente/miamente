name: Frontend CI

on:
  push:
    branches: ["**"]
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"
      - ".github/actions/setup-frontend/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"
      - ".github/actions/setup-frontend/**"

env:
  # Frontend environment variables
  NEXT_PUBLIC_API_URL: http://localhost:8000
  NODE_ENV: test

defaults:
  run:
    working-directory: apps/web

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js & deps
        uses: ./.github/actions/setup-frontend
        with:
          node-version: "22"

      - name: Run ESLint
        run: |
          echo "Running ESLint..."
          npm run lint -- --output-file=eslint-report.json --format=json || echo "ESLint completed with issues"
          echo "ESLint report created:"
          ls -la eslint-report.json || echo "❌ eslint-report.json not found"

      - name: Run Prettier Check
        run: |
          echo "Running Prettier check..."
          npm run format:check > prettier-report.txt 2>&1 || echo "Prettier check completed with issues"
          echo "Prettier report created:"
          ls -la prettier-report.txt || echo "❌ prettier-report.txt not found"

      - name: Run TypeScript Check
        run: |
          echo "Running TypeScript check..."
          npm run typecheck > typecheck-report.txt 2>&1 || echo "TypeScript check completed with issues"
          echo "TypeScript report created:"
          ls -la typecheck-report.txt || echo "❌ typecheck-report.txt not found"

      - name: List all report files
        run: |
          echo "Current working directory: $(pwd)"
          echo "All files in current directory:"
          ls -la
          echo "Looking for report files:"
          find . -name "*report*" -type f || echo "No report files found"

      - name: Ensure report files exist
        run: |
          echo "Ensuring all report files exist..."
          touch eslint-report.json typecheck-report.txt prettier-report.txt
          echo "Report files after touch:"
          ls -la *report*.* || echo "No report files found"

      - name: Upload Lint Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-lint-reports
          path: |
            eslint-report.json
            typecheck-report.txt
            prettier-report.txt

  unit-tests:
    name: Unit & Accessibility Tests
    runs-on: ubuntu-latest
    needs:
      - lint
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js & deps
        uses: ./.github/actions/setup-frontend
        with:
          node-version: "22"

      - name: Run Unit & Accessibility Tests with Vitest and Coverage
        run: |
          npm run test:ci
          echo "Test execution completed. Checking for generated files..."
          echo "Looking for coverage directory:"
          ls -la coverage/ || echo "❌ coverage/ directory not found"
          echo "Looking for test-results directory:"
          ls -la test-results/ || echo "❌ test-results/ directory not found"
          echo "All files in current directory:"
          ls -la

      - name: Upload Test Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-unit-test-reports
          path: |
            coverage/
            test-results/

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    needs:
      - lint
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js & deps
        uses: ./.github/actions/setup-frontend
        with:
          node-version: "22"

      - name: Build Application
        run: |
          echo "Current directory: $(pwd)"
          echo "Running npm run build..."
          npm run build
          echo "Build completed. Checking for .next directory..."
          if [ -d ".next" ]; then
            echo "✅ .next directory found!"
            ls -la .next/
          else
            echo "❌ .next directory not found"
            echo "Current directory contents:"
            ls -la
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-build
          path: apps/web/.next
          retention-days: 1

  sonar:
    name: SonarCloud Frontend Analysis
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - build-test
    if: >
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'pull_request' &&
        (github.base_ref == 'main' || github.base_ref == 'develop'))
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Download lint artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frontend-lint-reports
          path: artifacts-downloaded

      - name: Download unit test artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frontend-unit-test-reports
          path: artifacts-downloaded

      - name: List downloaded files
        run: |
          echo "Checking for downloaded artifacts..."
          echo "Current working directory: $(pwd)"
          if [ -d "artifacts-downloaded" ]; then
            echo "✅ Artifacts directory found:"
            ls -la artifacts-downloaded
            if [ -f "artifacts-downloaded/coverage/lcov.info" ]; then
              echo "✅ Coverage file found:"
              ls -la artifacts-downloaded/coverage/lcov.info
              head -5 artifacts-downloaded/coverage/lcov.info
            else
              echo "❌ Coverage file not found"
              ls -la artifacts-downloaded/coverage/ || echo "Coverage directory not found"
            fi
          else
            echo "⚠️ No artifacts directory found"
            echo "Current directory contents:"
            ls -la
          fi

      - name: SonarCloud Scan (Frontend)
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          projectBaseDir: ./
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
