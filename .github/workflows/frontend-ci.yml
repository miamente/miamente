name: Frontend CI

on:
  pull_request:
    branches: [develop]
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"
      - ".github/actions/setup-frontend/**"

defaults:
  run:
    working-directory: apps/web

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js & deps
        uses: ./.github/actions/setup-frontend
        with:
          node-version: "22"

      - name: Run ESLint
        run: |
          echo "Running ESLint..."
          # Run normal lint for console output
          npm run lint || echo "ESLint found issues"
          # Generate JSON report separately to ensure it's always created
          npm run lint:json || echo "ESLint JSON report generated with issues"
          echo "ESLint report created:"
          ls -la eslint-report.json || echo "❌ eslint-report.json not found"
          # Verify JSON is valid
          if [ -f "eslint-report.json" ]; then
            echo "ESLint report size: $(wc -c < eslint-report.json) bytes"
            head -5 eslint-report.json || echo "Report content preview failed"
          fi

      - name: Run Prettier Check
        run: |
          echo "Running Prettier check..."
          npm run format:check > prettier-report.txt 2>&1 || echo "Prettier check completed with issues"
          echo "Prettier report created:"
          ls -la prettier-report.txt || echo "❌ prettier-report.txt not found"

      - name: Run TypeScript Check
        run: |
          echo "Running TypeScript check..."
          npm run typecheck > typecheck-report.txt 2>&1 || echo "TypeScript check completed with issues"
          echo "TypeScript report created:"
          ls -la typecheck-report.txt || echo "❌ typecheck-report.txt not found"

      - name: List all report files
        run: |
          echo "Current working directory: $(pwd)"
          echo "All files in current directory:"
          ls -la
          echo "Looking for report files:"
          find . -name "*report*" -type f || echo "No report files found"

      - name: Ensure report files exist
        run: |
          echo "Ensuring all report files exist..."
          touch eslint-report.json typecheck-report.txt prettier-report.txt
          echo "Report files after touch:"
          ls -la *report*.* || echo "No report files found"

      - name: Upload Lint Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-lint-reports
          path: |
            apps/web/eslint-report.json
            apps/web/typecheck-report.txt
            apps/web/prettier-report.txt

  unit-tests:
    name: Unit & Accessibility Tests
    runs-on: ubuntu-latest
    needs:
      - lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js & deps
        uses: ./.github/actions/setup-frontend
        with:
          node-version: "22"

      - name: Run Unit & Accessibility Tests with Vitest and Coverage
        run: |
          npm run test:ci
          echo "Test execution completed. Checking for generated files..."
          echo "Looking for coverage directory:"
          ls -la coverage/ || echo "❌ coverage/ directory not found"
          echo "Looking for test-results directory:"
          ls -la test-results/ || echo "❌ test-results/ directory not found"
          echo "All files in current directory:"
          ls -la

      - name: Upload Test Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-unit-test-reports
          path: |
            apps/web/coverage/
            apps/web/test-results/

  docker-build-validate:
    name: Docker build (validate, no push)
    runs-on: ubuntu-latest
    needs: [lint,unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          load: false
          tags: ${{ secrets.DOCKERHUB_FRONTEND_REPOSITORY }}:${{ github.sha }}
          
  sonar:
    name: SonarCloud Frontend Analysis
    runs-on: ubuntu-latest
    needs:
      - docker-build-validate
    steps:
      - uses: actions/checkout@v4

      - name: Download lint artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-lint-reports
          path: apps/web/artifacts-downloaded

      - name: Download unit test artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-unit-test-reports
          path: apps/web/artifacts-downloaded

      - name: SonarCloud Scan (Frontend)
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        with:
          projectBaseDir: apps/web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
