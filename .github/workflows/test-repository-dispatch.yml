name: Test Repository Dispatch

on:
  repository_dispatch:
    types: [test-dispatch]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Repository Dispatch
        run: |
          echo "Repository dispatch triggered successfully!"
          echo "Event type: ${{ github.event.action }}"
          echo "Client payload: ${{ toJson(github.event.client_payload) }}"
