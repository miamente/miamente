name: Develop CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'apps/web') || github.event_name == 'pull_request'
    
    defaults:
      run:
        working-directory: apps/web
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm run typecheck
      
      - name: Lint
        run: npm run lint
      
      - name: Build
        run: npm run build

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'apps/api') || github.event_name == 'pull_request'
    
    defaults:
      run:
        working-directory: apps/api
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      
      - name: Lint
        run: |
          black app --check
          pylint app --fail-under=9
          flake8 app
      
      - name: Type check
        run: mypy app
      
      - name: Test
        run: pytest tests/unit tests/integration --cov=app

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run security check
        run: |
          echo "🔒 Security checks would run here"
          # Aquí puedes agregar herramientas como Snyk, CodeQL, etc.
