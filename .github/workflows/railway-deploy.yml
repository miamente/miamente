name: Railway Deploy

on:
  push:
    branches: [staging, main]
  workflow_run:
    workflows: ["Frontend CI", "Backend CI"]
    types: [completed]
    branches: [staging, main]

jobs:
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Deploying to production environment"
            railway login --token ${{ secrets.RAILWAY_TOKEN }}
            railway environment set production
            railway up --detach
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "Deploying to staging environment"
            railway login --token ${{ secrets.RAILWAY_TOKEN }}
            railway environment set staging
            railway up --detach
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  run-e2e-tests:
    name: Run E2E Tests (Staging)
    runs-on: ubuntu-latest
    needs: deploy
    if: success() && github.ref == 'refs/heads/staging'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install

      - name: Wait for deployment
        run: sleep 60

      - name: Run full E2E test suite
        working-directory: tests/e2e
        run: npm test
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.STAGING_URL }}

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results-staging
          path: tests/e2e/test-results/
          retention-days: 30

  run-smoke-tests:
    name: Run Smoke Tests (Production)
    runs-on: ubuntu-latest
    needs: deploy
    if: success() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for deployment
        run: sleep 60

      - name: Run smoke tests only
        working-directory: tests/e2e
        run: npm run test:fast -- --grep "smoke|critical|login|health"
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.PRODUCTION_URL }}
          CI: true

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results-production
          path: tests/e2e/test-results/
          retention-days: 7
